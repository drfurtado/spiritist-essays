project:
  type: website

website:
  description: "Spiritist Inquiry — An open-access, peer-reviewed interdisciplinary journal on Spiritism and contemporary science"
  title: "Spiritist Inquiry"
  favicon: profile.jpg
  search: true
  navbar:
    title: "Spiritist Inquiry"
    right:
      - text: "Articles"
        href: index.qmd
      - text: "About the Journal"
        href: about.qmd
      - icon: rss
        href: index.xml
  page-footer:
    left: |
      [Legal](legal.html)
    center: |
      *Spiritist Inquiry: Interdisciplinary Journal of Spiritism and Contemporary Science* <br>
      Open access · Double-blind peer review

format:
  html:
    theme:
      light:
        - cosmo
        - brand
      dark:
        - darkly
        - brand
    css: styles.css
    toc: true
    include-after-body: _babelquarto-fixes.html

bibliography: references.bib
csl: apa.csl

babelquarto:
  languagecodes:
  - name: pt
    text: "Português (BR)"
  - name: en
    text: "English"
  mainlanguage: 'en'
  languages: ['pt']
lang: en
